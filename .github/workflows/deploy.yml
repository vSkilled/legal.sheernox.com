name: Deploy Legal Portal to Bunny.net S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-bunny-s3
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Bunny.net S3 Storage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Component Diagnostics
        run: npm test

      - name: Build Static Site with Astro 7
        run: npm run build

      - name: Regenerate & Verify Vector PDFs
        run: |
          python3 scripts/generate_pdfs.py --browser /usr/bin/google-chrome --source-dir dist --output-dir dist

      - name: Regenerate & Verify Plain Text Documents
        run: |
          python3 scripts/generate_txts.py --source-dir dist --output-dir dist

      - name: Configure AWS CLI Credentials for Bunny S3
        run: |
          aws configure set aws_access_key_id "${{ secrets.BUNNY_STORAGE_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.BUNNY_STORAGE_SECRET_ACCESS_KEY }}"
          aws configure set default.region "${{ secrets.BUNNY_STORAGE_REGION }}"

      - name: Sync dist/ to Bunny S3 Storage Root
        run: |
          aws s3 sync dist/ "s3://${{ secrets.BUNNY_STORAGE_BUCKET }}" \
            --endpoint-url "${{ secrets.BUNNY_STORAGE_ENDPOINT }}" \
            --delete

      - name: Purge Bunny Pull Zone Cache
        env:
          BUNNY_PULL_ZONE_ID: ${{ secrets.BUNNY_PULL_ZONE_ID }}
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
        run: |
          echo "Purging Bunny CDN cache for legal.sheernox.com..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://api.bunny.net/pullzone/${BUNNY_PULL_ZONE_ID}/purgeCache" \
            -H "AccessKey: ${BUNNY_API_KEY}" \
            -H "Content-Length: 0")
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          RESPONSE_BODY=$(echo "$RESPONSE" | grep -v "HTTP_STATUS:")
          echo "Purge API HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "204" ] || [ "$HTTP_STATUS" = "200" ]; then
            echo "Cache purged successfully!"
          else
            echo "::warning::Cache purge returned status $HTTP_STATUS: $RESPONSE_BODY"
          fi
          echo "Waiting 3s for edge propagation..."
          sleep 3

      - name: Verify Live Deployment
        run: |
          echo "Verifying live CDN endpoints on legal.sheernox.com..."
          curl -f -s -I "https://legal.sheernox.com/index.html" | head -n 5
          curl -f -s -I "https://legal.sheernox.com/favicon.ico" | head -n 5
          curl -f -s -I "https://legal.sheernox.com/terms-and-conditions.html" | head -n 5
          curl -f -s -I "https://legal.sheernox.com/terms-and-conditions.pdf" | head -n 5
          curl -f -s -I "https://legal.sheernox.com/terms-and-conditions.txt" | head -n 5
          curl -f -s -I "https://legal.sheernox.com/vulnerability-disclosure-policy.txt" | head -n 5
          curl -f -s -I "https://legal.sheernox.com/website-care-plan-terms.html" | head -n 5
          echo "Deployment verified successfully!"
